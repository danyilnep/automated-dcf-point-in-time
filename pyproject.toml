[project]
name = "automated-dcf-point-in-time"
version = "1.0.0"
description = "Monthly point-in-time DCF value screen on large US non-financial companies, backtested on QuantConnect with Morningstar fundamentals."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
# received/ holds the 2024 originals and results/ the code QuantConnect ran for each recorded
# backtest; both are verbatim records and are not linted.
extend-exclude = ["received", "results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# QuantConnect's AlgorithmImports is a star import that provides QCAlgorithm, Resolution, etc.
"main.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
